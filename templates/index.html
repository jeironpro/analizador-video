<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Video</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #1a1a2e; line-height: 1.6; }
        .container { max-width: 960px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 30px; color: #16213e; font-size: 1.8rem; }
        .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        h2 { font-size: 1.2rem; margin-bottom: 16px; color: #0f3460; }
        .upload-zone { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: all .2s; }
        .upload-zone:hover, .upload-zone.dragover { border-color: #0f3460; background: #f0f4ff; }
        .upload-zone input[type="file"] { display: none; }
        .upload-zone p { color: #64748b; }
        .upload-zone .icon { font-size: 2rem; margin-bottom: 8px; }
        .btn { display: inline-block; padding: 10px 24px; border: none; border-radius: 8px; font-size: .9rem; cursor: pointer; transition: all .2s; font-weight: 500; text-decoration: none; }
        .btn-primary { background: #0f3460; color: #fff; }
        .btn-primary:hover { background: #16213e; }
        .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-success { background: #059669; color: #fff; }
        .btn-success:hover { background: #047857; }
        .progress-bar { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; margin-top: 12px; overflow: hidden; display: none; }
        .progress-bar .fill { height: 100%; background: #0f3460; border-radius: 3px; transition: width .3s; width: 0; }
        .meta { font-size: .8rem; color: #64748b; margin-top: 4px; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: .75rem; font-weight: 500; }
        .tag-ok { background: #d1fae5; color: #065f46; }
        .tag-err { background: #fee2e2; color: #991b1b; }
        .size-bar { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: .75rem; background: #f1f5f9; color: #475569; font-weight: 500; }
        .terminal { background: #0d1117; color: #e6edf3; border-radius: 8px; padding: 16px; font-family: 'Courier New', monospace; font-size: .8rem; line-height: 1.5; margin-top: 12px; max-height: 300px; overflow-y: auto; display: none; }
        .terminal .line { white-space: pre-wrap; word-break: break-all; }
        .terminal .line.ok { color: #3fb950; }
        .terminal .line.error { color: #f85149; }
        .terminal .line.info { color: #79c0ff; }
        .terminal .line.checking { color: #d29922; }
        .terminal .line.complete { color: #3fb950; font-weight: bold; }
        .terminal .timestamp { color: #8b949e; margin-right: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #e2e8f0; }
        th { color: #64748b; font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: 1px; }
        td { font-size: .9rem; }
        .actions { display: flex; gap: 8px; }
        .actions .btn { padding: 6px 14px; font-size: .8rem; }
        .empty { text-align: center; color: #94a3b8; padding: 32px; }
        @media (max-width: 640px) {
            .container { padding: 12px; }
            th, td { padding: 8px 4px; font-size: .8rem; }
            .actions { flex-direction: column; gap: 4px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Analizador de Video</h1>

        <div class="card">
            <h2>Subir Video</h2>
            <div class="upload-zone" id="uploadZone">
                <div class="icon">&#128249;</div>
                <p><strong>Haz clic o arrastra un archivo aquí</strong></p>
                <p class="meta">Video de 50 MB a 200 MB — Formatos: MP4, WebM, MKV, AVI, MOV</p>
                <input type="file" id="fileInput" accept=".mp4,.webm,.mkv,.avi,.mov,.mpeg,.wmv">
            </div>
            <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
            <div class="terminal" id="terminal"></div>
        </div>

        <div class="card">
            <h2>Videos Almacenados</h2>
            <div id="videoList"><p class="empty">No hay videos almacenados</p></div>
        </div>
    </div>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const terminal = document.getElementById('terminal');

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => { e.preventDefault(); uploadZone.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

        function handleFile(file) {
            const sizeMB = file.size / 1024 / 1024;
            if (sizeMB < 50 || sizeMB > 500) {
                appendTerminal('error', `El archivo debe pesar entre 50 MB y 500 MB (${sizeMB.toFixed(1)} MB recibidos)`);
                return;
            }

            terminal.innerHTML = '';
            terminal.style.display = 'block';
            appendTerminal('info', `Iniciando subida: ${file.name} (${sizeMB.toFixed(1)} MB)`);

            const formData = new FormData();
            formData.append('video', file);

            progressBar.style.display = 'block';
            progressFill.style.width = '0%';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload', true);

            xhr.upload.onprogress = e => {
                if (e.lengthComputable) progressFill.style.width = (e.loaded / e.total * 100) + '%';
            };

            xhr.onload = () => {
                progressBar.style.display = 'none';
                const data = JSON.parse(xhr.responseText);
                if (xhr.status === 201) {
                    appendTerminal('ok', 'Archivo subido al servidor');
                    startProcessing(data.temp_id, data.temp_filename);
                } else {
                    const msg = data.error || 'Error desconocido';
                    appendTerminal('error', msg);
                }
            };

            xhr.onerror = () => {
                progressBar.style.display = 'none';
                appendTerminal('error', 'Error de conexión al subir el archivo');
            };

            xhr.send(formData);
        }

        function startProcessing(tempId, tempFilename) {
            appendTerminal('info', 'Iniciando análisis...');
            const evtSource = new EventSource(`/api/process/${tempId}?temp_filename=${encodeURIComponent(tempFilename)}`);

            evtSource.addEventListener('step', e => {
                const data = JSON.parse(e.data);
                const status = data.status;
                const msg = data.message;
                if (status === 'checking') {
                    appendTerminal('checking', `\u25E6 ${msg}`);
                } else if (status === 'ok' || status === 'info') {
                    const icon = status === 'ok' ? '\u2713' : '\u2192';
                    appendTerminal(status, `${icon} ${msg}`);
                } else if (status === 'error') {
                    appendTerminal('error', `\u2717 ${msg}`);
                }
            });

            evtSource.addEventListener('complete', e => {
                evtSource.close();
                const data = JSON.parse(e.data);
                appendTerminal('complete', `\u2713 Proceso completado`);
                loadVideos();
            });

            evtSource.addEventListener('error', e => {
                evtSource.close();
                let msg = 'Error durante el procesamiento';
                if (e.data) {
                    try {
                        const data = JSON.parse(e.data);
                        msg = data.message || msg;
                    } catch (_) {}
                }
                appendTerminal('error', `\u2717 ${msg}`);
            });
        }

        function appendTerminal(type, text) {
            const line = document.createElement('div');
            line.className = 'line ' + type;
            const ts = document.createElement('span');
            ts.className = 'timestamp';
            const now = new Date();
            ts.textContent = now.toLocaleTimeString('es-ES');
            line.appendChild(ts);
            line.appendChild(document.createTextNode(text));
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function loadVideos() {
            fetch('/api/videos')
                .then(r => r.json())
                .then(videos => {
                    const container = document.getElementById('videoList');
                    if (videos.length === 0) {
                        container.innerHTML = '<p class="empty">No hay videos almacenados</p>';
                        return;
                    }
                    let html = `
                        <table>
                            <thead><tr>
                                <th>Nombre</th>
                                <th>Tamaño</th>
                                <th>Formato</th>
                                <th>Subido</th>
                                <th>Acciones</th>
                            </tr></thead>
                            <tbody>
                    `;
                    videos.forEach(v => {
                        const size = (v.size / 1024 / 1024).toFixed(1);
                        const date = new Date(v.uploaded_at).toLocaleString('es-ES');
                        html += `
                            <tr>
                                <td><strong>${escapeHtml(v.original_name)}</strong></td>
                                <td><span class="size-bar">${size} MB</span></td>
                                <td><span class="tag tag-ok">${escapeHtml(v.container || '?')}</span></td>
                                <td>${date}</td>
                                <td class="actions">
                                    <a href="/api/download/${v.id}" class="btn btn-success">Descargar</a>
                                    <button class="btn btn-danger" onclick="deleteVideo('${v.id}')">Eliminar</button>
                                </td>
                            </tr>
                        `;
                    });
                    html += '</tbody></table>';
                    container.innerHTML = html;
                })
                .catch(() => {});
        }

        function deleteVideo(id) {
            if (!confirm('¿Eliminar este video definitivamente?')) return;
            fetch('/api/delete/' + id, { method: 'DELETE' })
                .then(r => {
                    if (r.ok) {
                        loadVideos();
                        appendTerminal('info', 'Video eliminado correctamente');
                    } else {
                        appendTerminal('error', 'Error al eliminar el video');
                    }
                })
                .catch(() => appendTerminal('error', 'Error de conexión'));
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        loadVideos();
    </script>
</body>
</html>
