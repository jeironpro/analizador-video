<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizador de Video</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="navbar navbar-dark border-bottom" style="border-color:rgba(79,140,255,0.12)!important;background:#0d1124">
  <div class="container">
    <span class="navbar-brand mb-0 d-flex align-items-center gap-2">
      <i class="bi bi-camera-reels" style="color:#e94560;font-size:1.4rem"></i>
      <span>Analizador de Video</span>
    </span>
    <span class="badge bg-primary bg-opacity-25 text-primary px-3 py-2" id="videoCount">0 videos</span>
  </div>
</nav>

<div class="container py-4">

  <!-- Upload -->
  <div class="card-glow p-0">
    <div class="card-header-glow">
      <h5 class="mb-0 d-flex align-items-center gap-2">
        <i class="bi bi-cloud-arrow-up text-primary"></i> Subir Videos
      </h5>
    </div>
    <div class="p-4">
      <div class="upload-zone" id="uploadZone">
        <i class="bi bi-cloud-arrow-up upload-icon"></i>
        <h6 class="fw-semibold mb-1">Arrastra archivos aquí o haz clic para seleccionar</h6>
        <p class="text-muted small mb-0">50 MB – 500 MB &middot; MP4, WebM, MKV, AVI, MOV, MPEG, WMV</p>
        <input type="file" id="fileInput" accept=".mp4,.webm,.mkv,.avi,.mov,.mpeg,.wmv" multiple>
      </div>
      <div class="progress-custom mt-3 d-none" id="progressBar">
        <div class="progress-bar-custom" id="progressFill"></div>
      </div>
    </div>
  </div>

  <!-- Queue -->
  <div class="card-glow mt-4 d-none" id="queueCard">
    <div class="card-header-glow d-flex justify-content-between align-items-center">
      <h5 class="mb-0 d-flex align-items-center gap-2">
        <i class="bi bi-list-task text-warning"></i> Cola de Procesamiento
      </h5>
      <span class="badge bg-warning bg-opacity-25 text-warning px-3 py-2" id="queueCount">0</span>
    </div>
    <div class="p-3" id="queueContainer"></div>
  </div>

  <!-- Videos -->
  <div class="card-glow mt-4">
    <div class="card-header-glow">
      <h5 class="mb-0 d-flex align-items-center gap-2">
        <i class="bi bi-film text-success"></i> Videos Almacenados
      </h5>
    </div>
    <div class="p-0" id="videoList">
      <div class="empty-state">
        <i class="bi bi-film"></i>
        <p class="mb-0">No hay videos almacenados</p>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
