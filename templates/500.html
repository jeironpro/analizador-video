<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Error interno</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="error-page">
    <i class="bi bi-exclamation-triangle error-icon" style="color:#ef4444"></i>
    <div class="error-code">500</div>
    <h4 class="mt-2">Error interno del servidor</h4>
    <p>Ocurrió un error inesperado. Intenta nuevamente más tarde.</p>
    <a href="/" class="btn btn-primary rounded-pill px-4 mt-2">
      <i class="bi bi-arrow-clockwise me-1"></i> Reintentar
    </a>
  </div>
</body>
</html>
