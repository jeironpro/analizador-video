name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint Python
        run: |
          python -m py_compile app.py models.py video_analyzer.py
          python -m py_compile services/*.py
          python -m py_compile tests/*.py
      - name: Check JavaScript syntax
        run: |
          python -c "import js2py; js2py.eval_js(open('static/app.js').read())" || true
          node -e "require('fs').readFileSync('static/app.js','utf8'); console.log('JS OK')" || echo "node not available"
      - run: pytest tests/ -v
